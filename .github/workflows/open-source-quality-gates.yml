name: Public Quality Gates
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: public-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm run knip
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - run: NODE_OPTIONS=--max-old-space-size=4096 npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm run graph:structure:gate
      - name: Check public release identity and documentation links
        run: npm run docs:check
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:coverage
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install checksum-pinned gitleaks 8.18.4
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          test "$(gitleaks version)" = 8.18.4
      - name: Prove the secret detector is non-vacuous
        run: |
          control_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-control.XXXXXX")
          trap 'rm -rf "$control_dir"' EXIT
          printf 'token = "ghp_%s"\n' 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789' > "$control_dir/package-lock.json"
          set +e
          gitleaks detect --pipe --config .gitleaks.toml --redact=100 --no-banner --report-format json --report-path "$control_dir/report.json" < "$control_dir/package-lock.json"
          control_status=$?
          set -e
          test "$control_status" = 1
          grep -q '"RuleID": "github-pat"' "$control_dir/report.json"
          rm -rf "$control_dir"
          trap - EXIT
      - name: Scan the checked-out tree and every lockfile
        run: |
          gitleaks detect --no-git --source . --config .gitleaks.toml --redact=100 --no-banner --verbose
          git ls-files -z -- 'package-lock.json' '*/package-lock.json' 'pnpm-lock.yaml' '*/pnpm-lock.yaml' |
            while IFS= read -r -d '' lockfile; do
              gitleaks detect --pipe --config .gitleaks.toml --redact=100 --no-banner < "$lockfile"
            done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - run: npm run test:security
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p "$HOME/.cache/firebase/emulators"
      - run: npm run test:emulator
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - run: npm ci --prefix agent
      - run: npm audit --prefix agent --audit-level=critical
      - run: npm run lint --prefix agent
      - run: npm run typecheck --prefix agent
      - run: npm test --prefix agent
      - run: npm run build --prefix agent
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - run: npm ci --prefix agent
      - run: npm run build --prefix agent
      - name: Build public application
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:000000000000'
        run: NODE_OPTIONS=--max-old-space-size=4096 npm run build
      - name: Prove generated source and documentation are fixed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - run: npm ci
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - run: mkdir -p "$HOME/.cache/firebase/emulators"
      - run: npx playwright install chromium --with-deps
      - run: npm run e2e:contracts
      - run: npm run test:security:browser
      - name: Run retained browser lanes
        env:
          CI: 'true'
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'true'
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-radarist
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-radarist.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:000000000000'
        run: |
          NODE_OPTIONS=--max-old-space-size=4096 npm run e2e
          NODE_OPTIONS=--max-old-space-size=4096 npm run e2e:accessibility
          NODE_OPTIONS=--max-old-space-size=4096 npm run e2e:report-publication
  final:
    if: always()
    needs: [audit-lint, typecheck, coverage, security, emulator, agent, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.audit-lint.result }}" = success && test "${{ needs.typecheck.result }}" = success && test "${{ needs.coverage.result }}" = success && test "${{ needs.security.result }}" = success && test "${{ needs.emulator.result }}" = success && test "${{ needs.agent.result }}" = success && test "${{ needs.build.result }}" = success && test "${{ needs.e2e.result }}" = success
