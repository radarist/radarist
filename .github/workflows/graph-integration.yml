name: Graph Integration
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: graph-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  graph-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEO4J_URI: bolt://127.0.0.1:17687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-graph-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.7.0
          cache: npm
      - run: test "$(node --version)" = v24.7.0 && test "$(npm --version)" = 11.5.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Provision checksum-pinned Neo4j GDS 2.6.9
        run: |
          mkdir -p "$RUNNER_TEMP/radarist-gds"
          curl --fail --location --silent --show-error --max-filesize 67108864 https://graphdatascience.ninja/neo4j-graph-data-science-2.6.9.jar -o "$RUNNER_TEMP/radarist-gds/graph-data-science.jar"
          test "$(wc -c < "$RUNNER_TEMP/radarist-gds/graph-data-science.jar" | tr -d ' ')" = 60135088
          echo "9462a31555e8dfc7d3342d9d0d02a11bcb17e99b9c811648748a1e2b4f4fcbe5  $RUNNER_TEMP/radarist-gds/graph-data-science.jar" | sha256sum -c -
      - name: Start disposable Neo4j with the pinned plugin
        run: |
          docker run --platform linux/amd64 --detach --name radarist-public-graph-ci \
            --publish 127.0.0.1:17687:7687 --publish 127.0.0.1:7474:7474 \
            --env NEO4J_AUTH=neo4j/ci-graph-password \
            --env NEO4J_dbms_security_procedures_unrestricted=gds.* \
            --volume "$RUNNER_TEMP/radarist-gds/graph-data-science.jar:/plugins/graph-data-science.jar:ro" \
            neo4j:5.15.0-community@sha256:69c579facb7acab1e98f28952b91144c89e469a081804a5dafebd6c3030433b8
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:7474 >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs radarist-public-graph-ci
          exit 1
      - name: Prove exact authenticated GDS version
        run: |
          npx tsx -e "import { waitForNeo4jGdsReadiness } from './scripts/lib/neo4j-gds-readiness'; waitForNeo4jGdsReadiness(process.env).then((version) => { if (version !== '2.6.9') throw new Error('expected GDS 2.6.9, got ' + version); }).catch((error) => { console.error(error); process.exit(1); });"
      - name: Initialize graph schema
        run: npx tsx scripts/init-neo4j-schema.ts
      - name: Prove schema initialization fails loudly
        run: |
          if NEO4J_URI=bolt://127.0.0.1:9999 npx tsx scripts/init-neo4j-schema.ts; then
            echo "Graph schema initialization unexpectedly passed against an unreachable target."
            exit 1
          fi
      - name: Run graph operational gates
        env:
          NEO4J_INTEGRATION_DISPOSABLE: 'true'
          GRAPH_CANARY_DISPOSABLE: 'true'
        run: npm run test:graph:operational
      - name: Run real Neo4j integration
        env:
          NEO4J_INTEGRATION_DISPOSABLE: 'true'
        run: npm run test:integration:neo4j
      - name: Run AgentRun reconciliation
        env:
          NEO4J_DATABASE: neo4j
          NEO4J_INTEGRATION_DISPOSABLE: 'true'
        run: npm run test:integration:agent-run-reconciliation
      - name: Re-run schema initialization idempotently
        run: npx tsx scripts/init-neo4j-schema.ts
      - name: Stop disposable Neo4j
        if: always()
        run: docker rm --force radarist-public-graph-ci || true
